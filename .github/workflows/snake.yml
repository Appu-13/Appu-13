name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Appu-13
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff0000

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
